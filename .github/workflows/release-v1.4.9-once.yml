name: Release v1.4.9 Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.4.9-once.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install numpy

      - name: Regenerate synthetic fixtures
        run: python tests/fixtures_builder.py

      - name: Run bpy-free semantic test suite
        run: python tests/run_tests.py

      - name: Verify addon version
        run: grep -F 'bl_info["version"] = (1, 4, 9)' bz98tools/__init__.py

      - name: Build addon zip
        run: zip -r bz98tools.zip bz98tools/

      - name: Create v1.4.9 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.9
          target_commitish: ${{ github.sha }}
          name: Release v1.4.9
          body_path: docs/RELEASE_NOTES_v1.4.9.md
          files: bz98tools.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
