name: Temporary Real Aspilo Acceptance

on:
  push:
    branches:
      - agent/pure-python-ogre-fastpath

permissions:
  contents: read

jobs:
  real-aspilo-blender52:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Blender 5.2.2
        run: python -m pip install --disable-pip-version-check bpy==5.2.2

      - name: Download real aspilo acceptance pair
        shell: bash
        run: |
          mkdir -p real-fixture
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-aba0-81f5-a43d-542af96d4c35/raw?se=2026-09-16T21%3A05%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=2210b002-bf26-5335-8d43-a6395616f292&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T19%3A59%3A25Z&ske=2026-09-17T19%3A59%3A25Z&sks=b&skv=2026-02-06&sig=PQop4A9sm3LnBWMgUO11enWFXxU6N3svzrkAqvW7c48%3D' -o real-fixture/aspilo.mesh
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-1adc-81f5-b931-2a319a5e90ea/raw?se=2026-09-16T21%3A05%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=ab45de12-476e-5659-a15e-eda8f56ba5e4&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T20%3A23%3A37Z&ske=2026-09-17T20%3A23%3A37Z&sks=b&skv=2026-02-06&sig=lT3jSGJPv/42ayb1Dx3wvTDo7IUJkDLKfFIncT524k8%3D' -o real-fixture/aspilo.skeleton.bin
          test "$(stat -c%s real-fixture/aspilo.mesh)" -eq 883818
          test "$(stat -c%s real-fixture/aspilo.skeleton.bin)" -eq 2091392
          sha256sum real-fixture/aspilo.mesh real-fixture/aspilo.skeleton.bin
          ls -lh real-fixture

      - name: Run real Blender 5.2 fast-path acceptance
        run: |
          python tests/blender52_real_asset_smoke.py \
            real-fixture/aspilo.mesh \
            real-fixture/aspilo.skeleton.bin \
            --output-dir artifacts/aspilo-real

      - name: Hash generated binaries
        if: success()
        shell: bash
        run: |
          sha256sum artifacts/aspilo-real/aspilo_fast52.mesh
          sha256sum artifacts/aspilo-real/aspilo_fast52.skeleton
          ls -lh artifacts/aspilo-real

      - name: Upload generated BZR pair
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aspilo-fast52-real-acceptance
          path: |
            artifacts/aspilo-real/aspilo_fast52.mesh
            artifacts/aspilo-real/aspilo_fast52.skeleton
          if-no-files-found: error
          retention-days: 7
