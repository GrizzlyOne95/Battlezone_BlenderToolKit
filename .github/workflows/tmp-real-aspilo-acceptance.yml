name: Temporary Real Aspilo Acceptance

on:
  push:
    branches:
      - agent/pure-python-ogre-fastpath

permissions:
  contents: read

jobs:
  real-aspilo-blender52:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download real aspilo acceptance pair
        shell: bash
        run: |
          mkdir -p real-fixture
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-c354-81f5-94b1-baffc5009d42/raw?se=2026-09-16T21%3A13%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=899aa7b7-f105-59de-886b-bd9a795258d2&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T20%3A19%3A02Z&ske=2026-09-17T20%3A19%3A02Z&sks=b&skv=2026-02-06&sig=VPdbnynGeEdRYaifaXdlp466gmBl7MY6P3/KlODFz8Q%3D' -o real-fixture/aspilo.mesh
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-2040-81f5-a7a5-432a8e54c0d5/raw?se=2026-09-16T21%3A13%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=d7acf7e3-2d81-54ee-ae87-dc84821c127c&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T20%3A06%3A02Z&ske=2026-09-17T20%3A06%3A02Z&sks=b&skv=2026-02-06&sig=OjooIsUeYRygdbrqhNg7NIr31QENaaBxM%2Br4axpwJ6k%3D' -o real-fixture/aspilo.skeleton.bin
          test "$(stat -c%s real-fixture/aspilo.mesh)" -eq 883818
          test "$(stat -c%s real-fixture/aspilo.skeleton.bin)" -eq 2091392
          sha256sum real-fixture/aspilo.mesh real-fixture/aspilo.skeleton.bin
          ls -lh real-fixture

      - name: Install Blender 5.2.2
        run: python -m pip install --disable-pip-version-check bpy==5.2.2

      - name: Run real Blender 5.2 fast-path acceptance
        run: |
          python tests/blender52_real_asset_smoke.py \
            real-fixture/aspilo.mesh \
            real-fixture/aspilo.skeleton.bin \
            --output-dir artifacts/aspilo-real

      - name: Hash generated binaries
        if: success()
        shell: bash
        run: |
          sha256sum artifacts/aspilo-real/aspilo_fast52.mesh
          sha256sum artifacts/aspilo-real/aspilo_fast52.skeleton
          ls -lh artifacts/aspilo-real

      - name: Upload generated BZR pair
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aspilo-fast52-real-acceptance
          path: |
            artifacts/aspilo-real/aspilo_fast52.mesh
            artifacts/aspilo-real/aspilo_fast52.skeleton
          if-no-files-found: error
          retention-days: 7
