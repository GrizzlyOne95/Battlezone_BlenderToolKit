name: Temporary Real Aspilo Acceptance

on:
  push:
    branches:
      - agent/pure-python-ogre-fastpath

permissions:
  contents: read

jobs:
  real-aspilo-blender52:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download real aspilo acceptance pair
        shell: bash
        run: |
          mkdir -p real-fixture
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-cb34-81f5-b29b-049fada92a3a/raw?se=2026-09-16T21%3A10%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=976cd67d-dec2-577d-b2f8-ff1974e46f6d&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T20%3A10%3A05Z&ske=2026-09-17T20%3A10%3A05Z&sks=b&skv=2026-02-06&sig=CKSOE%2BnznBSykoF9Jxflk9OJbwttSfQZLeiRlIkH0xw%3D' -o real-fixture/aspilo.mesh
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-5dcc-81f5-a17c-2bd2da9b6d70/raw?se=2026-09-16T21%3A10%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=f837497b-9091-55e2-9f64-47462e1a1192&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T20%3A01%3A50Z&ske=2026-09-17T20%3A01%3A50Z&sks=b&skv=2026-02-06&sig=lA8hWX%2BGZ2QquBCR7b7jiovkxp0DfGD2jXv7U7Bor0I%3D' -o real-fixture/aspilo.skeleton.bin
          test "$(stat -c%s real-fixture/aspilo.mesh)" -eq 883818
          test "$(stat -c%s real-fixture/aspilo.skeleton.bin)" -eq 2091392
          sha256sum real-fixture/aspilo.mesh real-fixture/aspilo.skeleton.bin
          ls -lh real-fixture

      - name: Install Blender 5.2.2
        run: python -m pip install --disable-pip-version-check bpy==5.2.2

      - name: Run real Blender 5.2 fast-path acceptance
        run: |
          python tests/blender52_real_asset_smoke.py \
            real-fixture/aspilo.mesh \
            real-fixture/aspilo.skeleton.bin \
            --output-dir artifacts/aspilo-real

      - name: Hash generated binaries
        if: success()
        shell: bash
        run: |
          sha256sum artifacts/aspilo-real/aspilo_fast52.mesh
          sha256sum artifacts/aspilo-real/aspilo_fast52.skeleton
          ls -lh artifacts/aspilo-real

      - name: Upload generated BZR pair
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aspilo-fast52-real-acceptance
          path: |
            artifacts/aspilo-real/aspilo_fast52.mesh
            artifacts/aspilo-real/aspilo_fast52.skeleton
          if-no-files-found: error
          retention-days: 7
