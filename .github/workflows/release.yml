name: Release Addon

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package addon
        shell: bash
        run: |
          archive="Battlezone_BlenderToolKit-${GITHUB_REF_NAME}.zip"
          zip -r "$archive" bz98tools/
          python - "$archive" <<'PY'
          import sys
          import zipfile

          archive = sys.argv[1]
          with zipfile.ZipFile(archive) as zf:
              names = set(zf.namelist())
          required = {"bz98tools/__init__.py"}
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Invalid Blender add-on archive; missing: {missing}")
          if any(name.startswith("BZ98RBlenderToolKit/") for name in names):
              raise SystemExit("Invalid archive layout: repository directory wrapped around bz98tools")
          print(f"Validated Blender add-on archive: {archive}")
          PY
          echo "archive=$archive" >> "$GITHUB_ENV"

      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="docs/RELEASE_NOTES_v${version}.md"
          if [[ -f "$notes_file" ]]; then
            echo "body_path=$notes_file" >> "$GITHUB_OUTPUT"
          else
            echo "body_path=README.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.archive }}
          name: Release ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
