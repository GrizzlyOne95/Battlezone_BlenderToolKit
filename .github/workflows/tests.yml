name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install numpy

      - name: Regenerate synthetic fixtures
        run: python tests/fixtures_builder.py

      - name: Run bpy-free semantic test suite
        run: python tests/run_tests.py

  native-ogre-oracle:
    runs-on: windows-latest
    needs: unit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install numpy

      - name: Load pure mesh with bundled native OGRE backend
        run: python tests/native_ogre_oracle.py

      - name: Recover native animation transform contract
        run: python tests/native_animation_oracle.py

      - name: Recover native pose transform contract
        run: python tests/native_pose_oracle.py
