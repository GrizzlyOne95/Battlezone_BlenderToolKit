name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install numpy

      - name: Regenerate synthetic fixtures
        run: python tests/fixtures_builder.py

      - name: Run bpy-free semantic test suite
        run: python tests/run_tests.py

      - name: Validate Blender add-on package layout
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          archive="Battlezone_BlenderToolKit-ci.zip"
          zip -r "$archive" bz98tools/
          python - "$archive" <<'PY'
          import sys
          import zipfile

          archive = sys.argv[1]
          with zipfile.ZipFile(archive) as zf:
              names = set(zf.namelist())
          if "bz98tools/__init__.py" not in names:
              raise SystemExit("Blender add-on archive is missing bz98tools/__init__.py")
          if any(name.startswith("BZ98RBlenderToolKit/") for name in names):
              raise SystemExit("Archive incorrectly wraps bz98tools in the repository directory")
          print(f"Validated Blender add-on archive: {archive}")
          PY

  blender-5-smoke:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Blender 5.2.2 Python module
        run: python -m pip install bpy==5.2.2

      - name: Exercise pure Ogre path in Blender 5.2
        run: python tests/blender52_smoke.py

      - name: Exercise rigged multi-UV fast path in Blender 5.2
        run: python tests/blender52_multi_uv_smoke.py

  native-ogre-oracle:
    runs-on: windows-latest
    needs: unit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate PowerShell acceptance helper syntax
        shell: pwsh
        run: |
          $null = [ScriptBlock]::Create((Get-Content -Raw scripts/Test-OgreFastPath52.ps1))

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install numpy

      - name: Load pure mesh with bundled native OGRE backend
        run: python tests/native_ogre_oracle.py

      - name: Recover native animation transform contract
        run: python tests/native_animation_oracle.py

      - name: Recover native pose transform contract
        run: python tests/native_pose_oracle.py
